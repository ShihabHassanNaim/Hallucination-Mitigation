# Hallucination Detection Pipeline — default config
# Override any field via env vars prefixed HALLUC_, e.g.
#   set HALLUC_TOPK=10             -> step06_retrieval.top_k: 10

models:
  embedder:      "BAAI/bge-m3"
  # HuggingFace generator (reads HUGGINGFACE_HUB_TOKEN / HF_TOKEN from .env).
  # Default is a small free instruct model that loads on CPU / low-VRAM GPUs;
  # swap to "meta-llama/Meta-Llama-3.1-8B-Instruct" if you have a gated-access
  # HF token and a beefier machine.
  generator:     "Qwen/Qwen2.5-0.5B-Instruct"
  alt_generator: "Qwen/Qwen2.5-1.5B-Instruct"
  # Optional OpenRouter generator (kept available but not used by default).
  openrouter:    "openai/gpt-oss-20b:free"
  reranker:      "BAAI/bge-reranker-v2-m3"
  nli:           "MoritzLaurer/mDeBERTa-v3-base-xnli-multilingual-nli-2mil7"
  gliner:        "knowledgator/gliner-bi-base-v1.0"
  spacy:         "en_core_web_sm"
  classifier:    "xgboost"        # "xgboost" or "sklearn-logreg"

step01_query_understanding:
  enabled: true
  rewrite_variants: 2
  intent_labels: ["factual", "opinion", "multi-hop", "math", "other"]

step02_grounded_generation:
  backend: "llama"               # "llama" or "qwen"
  max_new_tokens: 256
  temperature: 0.0
  dtype: "fp16"                  # fp16 | bf16 | 4bit | fp32
  device: "auto"                 # cpu | cuda | auto

step03_early_detection:
  threshold: 0.5
  feature_keys: ["cosine", "claim_count", "intrinsic_overlap", "answer_length"]

step04_confidence:
  method: "temperature"          # none | temperature | isotonic
  weights_path: "data/eedc_weights.json"

step05_claim_extraction:
  mode: "rule"                   # rule | llm | hybrid
  intrinsic_threshold: 0.7
  aggregated_threshold: 0.3

step06_retrieval:
  top_k: 5
  rrf_k: 60.0
  bm25_k1: 1.5
  bm25_b: 0.75
  weight_dense: 1.0
  weight_bm25: 1.0
  index_path: "data/index"

step07_reranking:
  enabled: true
  top_k: 5

step08_nli_verification:
  max_evidence_chars: 4000
  device: "auto"

step09_fusion_weights:
  similarity: 0.30
  retrieval:  0.20
  nli:        0.25
  coverage:   0.15
  eedc:       0.10

step10_regeneration:
  mode: "evidence"               # stub | evidence | regenerate
  max_attempts: 2

step11_final_gate:
  pass_threshold: 0.70
  abstain_threshold: 0.30
  max_regen_attempts: 2

step13_eval:
  metrics:
    - bleu
    - rouge_l
    - bert_score
    - recall_at_k
    - precision_at_k
    - mrr
    - ndcg
    - claim_precision
    - claim_recall
    - claim_f1
    - detection_accuracy
    - detection_precision
    - detection_recall
    - detection_f1
    - detection_roc_auc
    - hallucination_reduction_rate
    - claim_correction_rate
    - verification_success_rate
    - end_to_end_accuracy

prompt:
  system: |
    You are a precise assistant. Answer the user's question using ONLY the
    information in the provided context. If the context does not contain
    the answer, say "I don't know." Do not invent facts.
  user_template: |
    Context:
    {context}

    Question: {question}

    Answer:
